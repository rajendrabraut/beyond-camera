name: Live Clips build

on:
  pull_request:
    paths:
      - 'liveclips/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/liveclips.yml'
  push:
    branches: [main]
    paths:
      - 'liveclips/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/liveclips.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build
        run: ./gradlew :liveclips:testDebugUnitTest :liveclips:lintDebug :liveclips:assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BeyondLiveClips-debug
          path: liveclips/build/outputs/apk/debug/liveclips-debug.apk
          if-no-files-found: error
