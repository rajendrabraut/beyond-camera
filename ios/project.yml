name: BeyondCamera
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "11000.0"
    SWIFT_VERSION: "5.0"
targets:
  BeyondCamera:
    type: application
    platform: iOS
    sources:
      - BeyondCamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beyond.camera
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
